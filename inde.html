<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Questions and Answers</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        :root {
            --bg-color: #fff8f0;
            --heading-color: #2c3e50;
            --subheading-color: #d35400;
            --text-color: #555;
        }

        body {
            background-color: var(--bg-color);
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            
            color: var(--subheading-color);
        }

        h2, i {
            color: var(--heading-color);
        }

        p {
            color: var(--text-color);
            font-size: 18px;
        }

        .allcenter{
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
        }

        .inline{
            display: inline;
        }

        .ps-3{
            padding-left: 15px ;
        }
    </style>
</head>
<body>

    <h1 class="allcenter">Questions and Answers</h1>

    <h2 class="inline">Git version<i class="fa-solid fa-arrow-right ps-3"></i> <span class="ps-3">git -v</span></h2>  

    <h2>
        Login mate<i class="fa-solid fa-arrow-right ps-3"></i> <span class="ps-3"></span>
        git config --global user.email "taro@email.com"
        git config --global user.name "Taro Naam"
        </h2>
    <p>File mate<i class="fa-solid fa-arrow-right ps-3"></i> <span class="ps-3"></span> git add . </p>

    <p>Commit mate<i class="fa-solid fa-arrow-right ps-3"></i> <span class="ps-3"></span> git commit -m "commit message" </p>

    <h2>Status mate<i class="fa-solid fa-arrow-right ps-3"></i> <span class="ps-3"></span>git status</h2>

</body>
<script>
  const h2Style = getComputedStyle(document.querySelector("h2"));

  document.querySelectorAll("p, i").forEach(el => {
    el.style.fontSize = h2Style.fontSize;
    el.style.fontWeight = h2Style.fontWeight;
  });
</script>
</html>
